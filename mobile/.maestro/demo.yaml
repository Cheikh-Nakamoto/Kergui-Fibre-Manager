# Store-reviewer path, in demo mode (no box needed):
# welcome → demo → device list → cut / restore Wi-Fi access → the box's
# list full: a refused block, « La box accepte N appareils au plus » and the
# blocked devices away (#102) → block →
# unblock → journal → Conso tab → a past month and a device's 6-month curve
# → Wi-Fi tab: a network off and on, renamed and back, its password changed
# → Réglages: auto-reject on with "Tout accepter", then off → Foyer: the
# demo household → Relais à la maison: QR, the demo relay, the same six
# digits, confirmed → « Ce téléphone sert de relais »: its switch shows the
# relay's disclosure, « Annuler » leaves it off (#53); then the demo owner's
# QR, this phone's six digits, confirmed, the relay's state (no service)
# → Appareils: the remote banner, simulated and marked as the demo →
# « Internet de la maison » cut and restored, Conso and Wi-Fi via the
# (demo) relay → Foyer:
# « Accès à distance », Contrôler / Voir for 30 days, revoked, owner-only
# → « Téléphone perdu »: Awa made co-owner, a wrong box password refused,
# the household recovered at home with the demo box's password →
# « Alertes WhatsApp »: the message to send, « 1 pour bloquer » on and off
# → « Relais à la maison »: the demo relay renamed,
# the new name in Relais and Foyer (#57). Then a demo visitor joins, is
# signalled, approved, and joins again without a signal (#58). The
# Devices tab hides « ce téléphone » and the owner's other phone, with one
# line under the list that counts them (#86, #87). Last,
# « Signaler un problème »: the form, and sending refused in the demo (#84).
# Then « Politique de confidentialité » in Réglages, and « Supprimer mon
# compte » refused in the demo (#37).
# Before the demo: « Être un relais » on the welcome screen.
appId: org.kergui.app
---
- launchApp:
    clearState: true
- runFlow: welcome-relay-steps.yaml
- tapOn:
    id: welcome-demo
- runFlow: macfilter-setup-steps.yaml
- runFlow: wifi-cut-steps.yaml
- runFlow: list-full-steps.yaml
- runFlow: demo-steps.yaml
- runFlow: conso-steps.yaml
- runFlow: history-steps.yaml
- runFlow: wifi-ssid-steps.yaml
- runFlow: auto-reject-steps.yaml
- runFlow: household-steps.yaml
- runFlow: relay-pairing-steps.yaml
- runFlow: relay-disclosure-steps.yaml
- runFlow: relay-phone-steps.yaml
- runFlow: remote-steps.yaml
- runFlow: house-remote-steps.yaml
- runFlow: delegation-steps.yaml
- runFlow: recovery-steps.yaml
- runFlow: whatsapp-steps.yaml
- runFlow: relay-names-steps.yaml
- runFlow: device-approval-steps.yaml
- runFlow: device-sections-steps.yaml
- runFlow: this-phone-steps.yaml
- runFlow: report-steps.yaml
- runFlow: hub-backup-steps.yaml
- runFlow: account-privacy-steps.yaml
