# Store-reviewer path, in demo mode (no box needed):
# welcome → demo → device list → refuse a device at the Wi-Fi and let it back
# (the switch under « Bloqué », #108) → the Wi-Fi « Réservé à la maison »:
# the card, « Gérer », reserved, the add window and its QR code, reopened
# (#108, #111) → the box's
# list full: a refused block, « La box accepte N appareils au plus » and the
# blocked devices away (#102) → block →
# unblock → journal → Conso tab → a past month and a device's 6-month curve
# → Wi-Fi tab: a network off and on, renamed and back, its password changed;
# the app's own confirmation dialog, cancelled then confirmed (#119);
# then « Débloquer tous les appareils bloqués » after a block (#115)
# → Réglages: auto-reject on with "Tout autoriser", then off → Foyer: the
# demo household → « Téléphone perdu » before any relay: « Installer un
# relais » opens Relais à la maison, and Réglages' « Détails techniques »
# closed then opened (#124) → Relais à la maison: QR, the demo relay, the same six
# digits, confirmed → « Ce téléphone sert de relais »: its switch shows the
# relay's disclosure, « Annuler » leaves it off (#53); then the demo owner's
# QR, this phone's six digits, confirmed, the relay's state (no service)
# → Appareils: the remote banner, simulated and marked as the demo →
# « Internet de la maison » cut and restored, Conso and Wi-Fi via the
# (demo) relay → Foyer:
# « Accès à distance », Contrôler / Voir for 30 days, revoked, owner-only
# → « Téléphone perdu »: the relay found on the Wi-Fi by itself, the
# address field only under « Je ne le trouve pas » (#117); then Awa made
# co-owner, a wrong box password refused,
# the household recovered at home with the demo box's password →
# « Alertes WhatsApp »: the message to send, « 1 pour bloquer » on and off
# → « Relais à la maison »: the demo relay renamed,
# the new name in Relais and Foyer (#57). Then a demo visitor joins, is
# signalled, authorised, and joins again without a signal (#58); one
# vocabulary: « Appareils (N) », « À vérifier » / « Autoriser » on a sheet,
# « Oublier cette box » in Réglages (#118). The
# Devices tab hides « ce téléphone » and the owner's other phone, with one
# line under the list that counts them (#86, #87); the Wi-Fi tab keeps
# this phone's network on and warns before its new password, the Conso tab
# leaves this phone out, and its sheet offers no « Bloquer » (#113). Last,
# « Signaler un problème »: the form, and sending refused in the demo (#84).
# Then « Politique de confidentialité » in Réglages, and « Supprimer mon
# compte » refused in the demo (#37). Last, the demo shows no lock on the
# paid buttons nor on the Conso arrow: the demo opens everything (#120).
# Then a device in words: its type icon and name on the row, no MAC nor IP,
# and on its sheet « Donnez-lui un nom » and « Détails techniques », closed
# then opened (#121). Then the eye on the Wi-Fi password field: the
# password shown while typing, hidden, shown, and nothing saved (#122).
# Last, a new Wi-Fi password: shown while typed, the warning for every
# device of the house and this phone, then the screen with the password
# big, its QR code and « Envoyer sur WhatsApp » (#123). Then the
# notifications: one deleted and « Annuler » puts it back, « Tout effacer »
# without a question and « Annuler » again (#125).
# Before the demo: under « Autres choix » on the welcome screen,
# « Ce téléphone servira de relais » and « J’ai perdu mon téléphone » (#116).
appId: org.kergui.app
