# « Débloquer tous les appareils bloqués » (#115, audit C3), where the
# « Filtrage MAC » switch was: Laptop-Bureau is blocked from its sheet, then
# the Wi-Fi tab offers to unblock every device Kergui blocked, lists them in
# the confirmation, and gives them internet back (free). Starts in the tabs
# (wifi-ssid-steps.yaml ends on the Wi-Fi tab) and ends on the Wi-Fi tab,
# with Laptop-Bureau unblocked and authorised again, as the demo had it (a
# block withdraws the authorisation since #108, RFC-007 D1).
appId: org.kergui.app
---
- tapOn:
    id: tab-devices
# Scrolled to (#108: the Wi-Fi card at the top pushes the list down).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
# « Bloqué » among the sheet's three choices (#108): no question.
- scrollUntilVisible:
    element:
      id: device-trust-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-trust-blocked
- extendedWaitUntil:
    visible:
      id: device-blocked-badge
    timeout: 20000
- runFlow: trust-undo-close-steps.yaml
- back

# No switch any more: the explicit action, with the count.
- tapOn:
    id: tab-wifi
- extendedWaitUntil:
    visible:
      id: wifi-unblock-all
    timeout: 20000
    label: "« Débloquer tous les appareils bloqués » on the Wi-Fi tab"
- assertNotVisible: ".*Filtrage MAC.*"
- assertVisible: "Débloquer tous les appareils bloqués \\(\\d+\\)"
- tapOn:
    id: wifi-unblock-all
# The list comes before the confirmation.
- assertVisible: ".*retrouver(a|ont) internet tout de suite\\. Continuer \\?.*"
- assertVisible: ".*• Laptop-Bureau.*"
- tapOn: Oui, débloquer
- extendedWaitUntil:
    visible:
      id: wifi-unblock-all-done
    timeout: 20000
    label: "« N appareils débloqués ✅ »"
- extendedWaitUntil:
    notVisible:
      id: wifi-unblock-all
    timeout: 20000
    label: "Nothing Kergui blocked is left"

# A block withdrew Laptop-Bureau's authorisation (#108): give it back, so
# the demo is as it started.
- tapOn:
    id: tab-devices
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
- scrollUntilVisible:
    element:
      id: device-trust-authorised
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-trust-authorised
- extendedWaitUntil:
    visible:
      id: device-approved-badge
    timeout: 20000
- back
- tapOn:
    id: tab-wifi
