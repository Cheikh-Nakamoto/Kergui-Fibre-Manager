# Usage history (#33, Max, open in the demo): in the Conso tab, go back one
# month with the month selector and see that month's figures, come back to
# this month, then open Laptop-Bureau's sheet and see its 6-month curve.
# The demo seeds six past months at start (mobilecore seedDemoHistory), so
# it needs the F6600P demo box. Starts in the Conso tab, where
# conso-steps.yaml leaves a device name pasted in the search.
appId: org.kergui.app
---
- extendedWaitUntil:
    visible:
      id: usage-screen
    timeout: 20000
# Empty the search left by conso-steps.yaml, so every device shows: with
# the search bar's own clear button — eraseText left « 00:11 » of the
# address there (mobile-ci runs 46121369911, 46123577679).
- runFlow:
    when:
      visible:
        id: usage-search-clear-icon
    commands:
      - tapOn:
          id: usage-search-clear-icon
# No hideKeyboard here: the clear button opens no keyboard, and with none
# open it pressed « back » and left the Conso tab (mobile-ci run 46127812927).
# Scrolled to: the banners above the list can push it down (the Wi-Fi
# card, there since #108, left for the Wi-Fi tab in #134).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
    label: "Every demo device back in the Conso tab"
# Scrolling down to it can push the month's total off the top.
- scrollUntilVisible:
    element:
      id: usage-total
    direction: UP
    timeout: 20000
# Last month.
- tapOn:
    id: usage-month-prev
- extendedWaitUntil:
    visible:
      id: usage-month-past
    timeout: 20000
    label: "A past month's total"
- assertVisible: "En .* : .* pour toute la maison"
- assertVisible: Laptop-Bureau
# One more month back, then back to this month.
- tapOn:
    id: usage-month-prev
- assertVisible:
    id: usage-month-past
- tapOn:
    id: usage-month-next
- tapOn:
    id: usage-month-next
- extendedWaitUntil:
    visible:
      id: usage-total
    timeout: 20000
    label: "Back on this month"
# The device sheet: its last 6 months. Lower since « Donnez-lui un nom »
# heads an unnamed device's sheet (#121): scrolled to.
- tapOn: Laptop-Bureau
- extendedWaitUntil:
    visible:
      id: device-head
    timeout: 20000
- scrollUntilVisible:
    element:
      id: device-usage-chart
    direction: DOWN
    timeout: 20000
    label: "Laptop-Bureau's 6-month curve"
- assertVisible: "Consommation sur 6 mois"
- back
