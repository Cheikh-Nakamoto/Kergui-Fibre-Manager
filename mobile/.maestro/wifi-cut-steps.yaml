# Refusing a device at the Wi-Fi on the demo F6600P (#31; since #108 the
# switch « Ne plus le laisser se connecter du tout (même au Wi-Fi) », folded
# under « Plus d'options » below « Bloqué », where « Couper l'accès » was):
# Laptop-Bureau blocked with the switch on, « Ne peut plus se connecter »
# on its sheet and in its section of « Bloqués », then back to « Autorisé »
# as the demo had it. No question first: an « Annuler » bar instead (#111
# R6), closed here. Starts and ends on the demo device list.
appId: org.kergui.app
---
# Scrolled to (#108: the Wi-Fi card at the top pushes the list down).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
- scrollUntilVisible:
    element:
      id: device-trust-more
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: device-toggle-wifi-cut
- tapOn:
    id: device-trust-more
- scrollUntilVisible:
    element:
      id: device-trust-cut-row
    direction: DOWN
    timeout: 20000
- assertVisible: "Ne plus le laisser se connecter du tout \\(même au Wi-Fi\\)"
- tapOn:
    id: device-trust-cut-row
- scrollUntilVisible:
    element:
      id: device-trust-blocked
    direction: UP
    timeout: 20000
- tapOn:
    id: device-trust-blocked
- extendedWaitUntil:
    visible:
      id: device-cut-badge
    timeout: 20000
    label: "The sheet says « Ne peut plus se connecter »"
- assertVisible: "Ne peut plus se connecter"
- runFlow: trust-undo-close-steps.yaml
- back
# Refused at the Wi-Fi: its own section of « Bloqués ».
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-blocked
# Below « Bloqués · pas d'internet » and the Wi-Fi card (#108): scroll to it.
- scrollUntilVisible:
    element:
      id: devices-cut-section
    direction: DOWN
    timeout: 20000
    label: "« Bloqués · ne peuvent plus se connecter »"
# Back to « Autorisé » (free): unblocked, let back on the Wi-Fi, authorised.
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
- scrollUntilVisible:
    element:
      id: device-trust-authorised
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-trust-authorised
- extendedWaitUntil:
    visible:
      id: device-approved-badge
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: device-cut-badge
    timeout: 20000
- back
- extendedWaitUntil:
    notVisible:
      id: devices-cut-section
    timeout: 20000
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-connected
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-connected
