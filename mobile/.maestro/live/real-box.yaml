# On the owner's REAL box, not the demo: the app's own session, the phone
# joined to a test network made for this (SSID below). Run by hand only,
# never by CI (it has no box):
#
#   maestro --device <serial or ip:port> test -e SSID=Maestro-kergui \
#     -e AP=DEV.WIFI.AP4 mobile/.maestro/live/real-box.yaml
#
# AP is the network's id on the box (its card is wifi-ssid-<AP>); the
# first Wi-Fi check makes sure it carries SSID, so a wrong AP stops the run
# before anything is touched. On Android the card's parts are siblings, not
# children, so the steps aim at ids, not at « inside the card ».
#
# The rule of this file: it NEVER confirms a write. Every action on the
# test network is opened, checked, then cancelled — renaming that network or
# changing its password would cut the phone that runs the test. It touches no
# other network and opens no household device. The Wi-Fi password is not in
# this file, nor anywhere in the repository.
appId: org.kergui.app
env:
  SSID: Maestro-kergui
  AP: DEV.WIFI.AP4
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-devices
    timeout: 30000
    label: "The app is open on a box"
# The real box, not the demo.
- assertNotVisible:
    id: demo-visitor-join
- assertNotVisible:
    id: welcome-demo

# Devices: the tab counts what it lists (#118), this phone is never listed
# and never blocked (#113).
- tapOn:
    id: tab-devices
- scrollUntilVisible:
    element: "Appareils \\(\\d+\\)"
    direction: DOWN
    timeout: 20000
    label: "« Appareils (N) »"
- assertNotVisible: "Connectés \\(\\d+\\)"
- scrollUntilVisible:
    element:
      id: devices-hidden
    direction: DOWN
    timeout: 20000
    label: "« Ce téléphone n'est pas dans la liste »"
- assertVisible: "Ce téléphone.* pas dans la liste.*Kergui ne .* bloque jamais.*"
# The Wi-Fi's card left Appareils for the Wi-Fi tab (#134).
- assertNotVisible:
    id: lock-card

# Wi-Fi: the test network, by its name.
- scrollUntilVisible:
    element:
      id: tab-wifi
    direction: UP
- tapOn:
    id: tab-wifi
- extendedWaitUntil:
    visible:
      id: wifi-screen
    timeout: 30000
# At the top of the tab (#134): the Wi-Fi's card, its state in words. Only
# looked at: « Gérer » is not opened here.
- scrollUntilVisible:
    element:
      id: wifi-top
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element:
      id: lock-card
    direction: DOWN
    timeout: 20000
    label: "The Wi-Fi's card on the Wi-Fi tab"
- assertVisible:
    id: lock-state
    text: "Ouvert avec mot de passe|Réservé à la maison|Ajout d’appareil : encore \\d+ min|En cours…"
- scrollUntilVisible:
    element:
      id: wifi-ssid-switch-${AP}
    direction: DOWN
    timeout: 20000
    label: "The ${SSID} card"
# The id really is the test network: stop here otherwise, nothing touched.
- assertVisible:
    id: wifi-ssid-switch-${AP}
    text: ${SSID}
# This phone is on it: Kergui says so and keeps it on (#113).
- assertVisible:
    id: wifi-ssid-this-phone-${AP}
- tapOn:
    id: wifi-ssid-switch-${AP}
- assertNotVisible:
    id: confirm-dialog
- assertNotVisible: "Éteindre le réseau .*"

# Rename: the question names both names (#119), then « Annuler ».
- scrollUntilVisible:
    element:
      id: wifi-ssid-name-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-name-${AP}
- waitForAnimationToEnd
- eraseText: 40
- inputText: "${SSID}-x"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: wifi-ssid-rename-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-rename-${AP}
- extendedWaitUntil:
    visible:
      id: confirm-dialog
    timeout: 10000
- assertVisible: ".*« ${SSID} » en « ${SSID}-x ».*"
- tapOn:
    id: confirm-cancel
- assertNotVisible:
    id: confirm-dialog
# Give the field its name back (nothing was sent).
- scrollUntilVisible:
    element:
      id: wifi-ssid-name-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-name-${AP}
- waitForAnimationToEnd
- eraseText: 40
- inputText: ${SSID}
- hideKeyboard

# Password: visible while typing (#123), the warning says this phone goes
# too (#113), then « Annuler ».
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-open-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-open-${AP}
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-${AP}
- waitForAnimationToEnd
- inputText: "pas-envoye-1"
- hideKeyboard
- assertVisible: "pas-envoye-1"
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-save-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-save-${AP}
- extendedWaitUntil:
    visible:
      id: confirm-dialog
    timeout: 10000
- assertVisible: "Changer le mot de passe du réseau « ${SSID} » \\?"
- assertVisible: ".*ce téléphone aussi.*"
- tapOn:
    id: confirm-cancel
- assertNotVisible:
    id: confirm-dialog
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-cancel-${AP}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-cancel-${AP}
- assertNotVisible: "pas-envoye-1"
- assertNotVisible: "Mot de passe changé\\."

# Réglages: the box by its model, the technical details folded (#124).
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-box-model
    direction: DOWN
    timeout: 20000
- assertVisible: "Box.*"
# Every backup under one title (#134): looked at, nothing sent.
- scrollUntilVisible:
    element: "Paramètres de sauvegarde"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: settings-backup
- scrollUntilVisible:
    element:
      id: settings-technical
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: settings-box-fingerprint
- tapOn:
    id: settings-technical
- scrollUntilVisible:
    element:
      id: settings-box-fingerprint
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings-technical
- tapOn:
    id: tab-devices
