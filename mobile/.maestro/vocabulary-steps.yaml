# One vocabulary (#118, audit H2, M4, M5): the first tab of Devices is
# « Appareils (N) », the list it counts; a device's sheet has one block,
# « Autorisé » or « À vérifier » with one « Autoriser »; Réglages says
# « Oublier cette box », never « Changer de box ». On the demo: Laptop-Bureau
# loses its authorisation and gets it back, so the demo is left as it was.
# No clearState: runs after the demo is open, alone (local-e2e.sh --flow) or
# in demo.yaml / demo-device.yaml. Ends at the top of the Devices tab.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-devices
    commands:
      - back
- tapOn:
    id: tab-devices
- runFlow: devices-top-steps.yaml

# The tab counts what it lists.
- extendedWaitUntil:
    visible: "Appareils \\(\\d+\\)"
    timeout: 20000
    label: "The first tab is « Appareils (N) »"
- assertNotVisible: "Connectés \\(\\d+\\)"

# The sheet: one block, one word.
- tapOn:
    id: devices-filter-connected
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
- extendedWaitUntil:
    visible:
      id: device-rename-input
    timeout: 10000
    label: "Laptop-Bureau's sheet"
- runFlow:
    when:
      visible:
        id: device-unapprove
    commands:
      - assertVisible: "Autorisé"
      - tapOn:
          id: device-unapprove
- extendedWaitUntil:
    visible:
      id: device-approve
    timeout: 10000
    label: "« À vérifier », with « Autoriser »"
- assertVisible: "À vérifier"
- assertVisible: "Autoriser"
- assertNotVisible: "Approuver"
- assertNotVisible: "Accepter cet appareil"
- tapOn:
    id: device-approve
- extendedWaitUntil:
    visible:
      id: device-approved-badge
    timeout: 10000
    label: "« Autorisé » again"
- assertVisible: "Autorisé"
- assertVisible: "Retirer l’autorisation"
- back

# Réglages: forgetting the box is « Oublier cette box ».
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
    timeout: 20000
    label: "Réglages scrolled to « Oublier cette box »"
- assertVisible: "Oublier cette box"
- assertNotVisible: "Changer de box"
- tapOn:
    id: tab-devices
- runFlow: devices-top-steps.yaml
