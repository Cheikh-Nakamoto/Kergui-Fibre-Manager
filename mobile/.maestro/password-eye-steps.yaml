# The eye on a password field (#122, audit H6), on the demo F6600P's
# Wi-Fi tab: open « Changer le mot de passe » on MonWiFi-2G, type a
# password, the eye shows it, then hides it again; « Annuler » closes the
# editor and nothing is saved. Starts in the tabs, or on a screen above
# them (device-names-steps.yaml ends on the device list). Ends on the Wi-Fi
# tab with the demo's own password unchanged. No clearState.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-wifi
    commands:
      - back
- tapOn:
    id: tab-wifi
- extendedWaitUntil:
    visible:
      id: wifi-ssid-DEV.WIFI.AP1
    timeout: 20000
    label: "The demo box's Wi-Fi networks"
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-open-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-open-DEV.WIFI.AP1
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-DEV.WIFI.AP1
- inputText: "maestro-eye-1"
- hideKeyboard
# Hidden while typing.
- assertNotVisible: "maestro-eye-1"
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-DEV.WIFI.AP1-eye
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-DEV.WIFI.AP1-eye
- extendedWaitUntil:
    visible: "maestro-eye-1"
    timeout: 10000
    label: "The eye shows the password"
- tapOn:
    id: wifi-ssid-password-DEV.WIFI.AP1-eye
- extendedWaitUntil:
    notVisible: "maestro-eye-1"
    timeout: 10000
    label: "The eye hides it again"
# Nothing saved: « Annuler » closes the editor without asking the box.
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-cancel-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-cancel-DEV.WIFI.AP1
- assertNotVisible:
    id: wifi-ssid-password-DEV.WIFI.AP1
- assertNotVisible: "Mot de passe changé.*"
