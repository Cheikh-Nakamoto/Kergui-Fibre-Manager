# Auto-reject (#35, Max, open in the demo) on the demo F6600P: from Réglages
# > Plus de fonctionnalités (#76), open "Rejet automatique", turn it on, see the devices on the box listed with "Tout
# autoriser et activer", authorise them all, see "Actif · 3 appareils autorisés",
# then turn it off again so the demo is left as it was, and go back to
# Plus de fonctionnalités. The 15 min after which a new device is refused
# cannot be shown here (the Go tests cover it on a fake clock). Starts on
# the Wi-Fi tab (wifi-ssid-steps.yaml) or any other tab.
appId: org.kergui.app
---
- runFlow: more-features-steps.yaml
- scrollUntilVisible:
    element:
      id: features-auto-reject
    direction: DOWN
- assertVisible: "Automatisation"
- tapOn:
    id: features-auto-reject
- extendedWaitUntil:
    visible:
      id: settings-auto-reject
    timeout: 10000
    label: "The auto-reject screen"
- assertVisible: "Rejet automatique"
# Left on by an interrupted run: start from off.
- runFlow:
    when:
      visible:
        id: settings-auto-reject-state
    commands:
      - tapOn:
          id: settings-auto-reject
      - extendedWaitUntil:
          notVisible:
            id: settings-auto-reject-state
          timeout: 20000

# On: the devices present are listed first, nothing is sent yet.
- tapOn:
    id: settings-auto-reject
- extendedWaitUntil:
    visible:
      id: settings-auto-reject-offer
    timeout: 10000
    label: "The list of the devices on the box"
# How many depends on what earlier steps left on the demo box (a blocked
# device is not offered for authorisation since #108, RFC-007 D1).
- assertVisible: "Appareils présents sur la box \\(\\d+\\)"
- scrollUntilVisible:
    element:
      text: Laptop-Bureau
    direction: DOWN
- scrollUntilVisible:
    element:
      id: settings-auto-reject-accept-all
    direction: DOWN
- tapOn:
    id: settings-auto-reject-accept-all
- extendedWaitUntil:
    visible:
      id: settings-auto-reject-state
    timeout: 20000
    label: "« Actif · N appareils autorisés »"
- assertVisible: "Actif · \\d+ appareils? autorisés?"
- assertNotVisible:
    id: settings-auto-reject-offer

# Off again (free): the demo is left as it was.
- scrollUntilVisible:
    element:
      id: settings-auto-reject
    direction: UP
- tapOn:
    id: settings-auto-reject
- extendedWaitUntil:
    notVisible:
      id: settings-auto-reject-state
    timeout: 20000
    label: "Auto-reject is off"
- back
- extendedWaitUntil:
    visible:
      id: features-auto-reject
    timeout: 10000
    label: "Back in Plus de fonctionnalités"
