# Shared by demo.yaml (CI, emulator, clean install) and demo-device.yaml
# (a real phone, data kept). Starts on the demo device list.
appId: org.kergui.app
---
# Scrolled to (#108: the Wi-Fi card at the top pushes the list down).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
# « Bloqué » among the sheet's three choices (#108): no question, an
# « Annuler » bar instead (#111 R6).
- scrollUntilVisible:
    element:
      id: device-trust-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-trust-blocked
- extendedWaitUntil:
    visible:
      id: device-blocked-badge
    timeout: 20000
# Back to « Autorisé » (#108): unblocked and authorised again, as the demo
# started (a block withdraws the authorisation, RFC-007 D1).
- scrollUntilVisible:
    element:
      id: device-trust-authorised
    direction: UP
    timeout: 20000
- tapOn:
    id: device-trust-authorised
- extendedWaitUntil:
    visible:
      id: device-approved-badge
    timeout: 20000

# The journal: the screen a household is asked to open when something does
# not work, so it has to show the calls that have just been made. The device
# screen covers the tabs, so it is left first.
- back
- tapOn: Réglages
- scrollUntilVisible:
    element:
      id: settings-journal
    direction: DOWN
- tapOn:
    id: settings-journal
# Newest first: since #108 the Wi-Fi lock is read too, so the block's
# POST can sit below the fold — scroll down to it.
- scrollUntilVisible:
    element: "HTTP POST /api/devices.*"
    direction: DOWN
    timeout: 20000
