# Shared by demo.yaml (CI, emulator, clean install) and demo-device.yaml
# (a real phone, data kept). Starts on the demo device list.
appId: org.kergui.app
---
- extendedWaitUntil:
    visible: Laptop-Bureau
    timeout: 20000
- tapOn: Laptop-Bureau
# At the foot of the device sheet, below the fold since #58: scroll to it.
- scrollUntilVisible:
    element:
      id: device-toggle-block
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-toggle-block
- tapOn: Oui, bloquer
- extendedWaitUntil:
    visible: Débloquer
    timeout: 20000
# At the foot of the device sheet, below the fold since #58: scroll to it.
- scrollUntilVisible:
    element:
      id: device-toggle-block
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-toggle-block
- tapOn: Oui, débloquer
- extendedWaitUntil:
    visible: Bloquer
    timeout: 20000

# The journal: the screen a household is asked to open when something does
# not work, so it has to show the calls that have just been made. The device
# screen covers the tabs, so it is left first.
- back
- tapOn: Réglages
- scrollUntilVisible:
    element:
      id: settings-journal
    direction: DOWN
- tapOn:
    id: settings-journal
- extendedWaitUntil:
    visible: "HTTP POST /api/devices.*"
    timeout: 20000
