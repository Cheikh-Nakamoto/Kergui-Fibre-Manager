# Back to the top of the Wi-Fi tab: since #134 the Wi-Fi's card
# (« Réservé à la maison », « Gérer ») sits above the networks, and the tab
# keeps its scroll position from earlier flows, so a flow scrolls back up
# before looking for the card or the first network.
appId: org.kergui.app
---
- scrollUntilVisible:
    element:
      id: wifi-top
    direction: UP
    timeout: 20000
