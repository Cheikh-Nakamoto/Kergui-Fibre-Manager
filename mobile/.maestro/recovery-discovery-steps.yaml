# « Récupérer à la maison » finds the relay by itself (#117, audit C4), in
# the demo. From Réglages, « Téléphone perdu »: the search on the Wi-Fi is
# simulated and finds the demo relay (« Relais trouvé », its address), with
# no address to type. « Je ne le trouve pas » opens the address field, the
# way out. Nothing is typed or sent. Starts in Réglages or on any tab, ends
# in Réglages (recovery-steps.yaml then recovers the household).
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-settings
    commands:
      - back
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-recovery
    direction: DOWN
- tapOn:
    id: settings-recovery
- extendedWaitUntil:
    visible:
      id: recovery-coowners
    timeout: 10000
    label: "The « Téléphone perdu » screen"
- scrollUntilVisible:
    element:
      id: recovery-relay-found
    direction: DOWN
    timeout: 15000
    label: "The demo relay found on the Wi-Fi"
- assertVisible: "Relais trouvé"
# The card's address line can sit below the fold, under the co-owners
# (mobile-ci run 46058973677): scroll to it rather than expect it on screen.
- scrollUntilVisible:
    element: "Adresse du relais : 192.168.1.20"
    direction: DOWN
    timeout: 15000
- assertNotVisible:
    id: recovery-relay-address
- scrollUntilVisible:
    element:
      id: recovery-not-found
    direction: DOWN
- tapOn:
    id: recovery-not-found
- scrollUntilVisible:
    element:
      id: recovery-relay-address
    direction: DOWN
    label: "The address field, only under « Je ne le trouve pas »"
- assertVisible: "Je ne le trouve pas"
- assertNotVisible:
    id: recovery-not-found
- back
- extendedWaitUntil:
    visible:
      id: settings-recovery
    timeout: 10000
    label: "Back in Réglages"
