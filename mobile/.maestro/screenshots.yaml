# Screenshots of the main screens for design review. mobile-ci runs it in
# light then dark mode and uploads them as the "screenshots" artifact.
appId: org.kergui.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-demo
    timeout: 20000
- takeScreenshot: shot-1-welcome
- tapOn:
    id: welcome-demo
- extendedWaitUntil:
    visible: PC-Bureau
    timeout: 20000
- takeScreenshot: shot-2-devices
- tapOn: Wi-Fi
- waitForAnimationToEnd
- takeScreenshot: shot-3-wifi
- tapOn: Réglages
- waitForAnimationToEnd
- takeScreenshot: shot-4-settings
