# WhatsApp alerts (#49) in the demo: from Réglages, « Alertes WhatsApp »:
# what the alerts are, « Recevoir les alertes sur WhatsApp » shows the
# « KERGUI … » message WhatsApp would open with (nothing leaves the demo),
# the number then reads as linked; « Répondre « 1 » pour bloquer » switched
# on after confirming, then off. Back to Réglages. Starts in Réglages (recovery-steps.yaml ends there)
# or on any tab.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-settings
    commands:
      - back
- tapOn:
    id: tab-settings
# The row sits near the top of Réglages, above where recovery-steps.yaml
# leaves the list.
- scrollUntilVisible:
    element:
      id: settings-whatsapp
    direction: UP
- tapOn:
    id: settings-whatsapp
- extendedWaitUntil:
    visible:
      id: whatsapp-optin
    timeout: 10000
    label: "The WhatsApp alerts screen"
- assertVisible: "Votre numéro ne reçoit pas encore les alertes"
- tapOn:
    id: whatsapp-optin
- extendedWaitUntil:
    visible:
      id: whatsapp-demo-message
    timeout: 5000
    label: "The message WhatsApp would open with"
- assertVisible: ".*KERGUI DEMO7K2P.*"
- assertVisible: "Votre numéro reçoit les alertes"
- scrollUntilVisible:
    element:
      id: whatsapp-hub-key
    direction: DOWN
- assertVisible: ".*Désactivé : une réponse à une alerte ne bloque rien.*"
- tapOn:
    id: whatsapp-hub-key
- extendedWaitUntil:
    visible: ".*répondez « 1 » à une alerte.*"
    timeout: 5000
    label: "The hub key confirmation"
- tapOn: "Confirmer"
- extendedWaitUntil:
    visible: ".*Activé : répondre « 1 » à une alerte bloque l.appareil.*"
    timeout: 5000
    label: "« 1 pour bloquer » is on"
- tapOn:
    id: whatsapp-hub-key
- extendedWaitUntil:
    visible: ".*Désactivé : une réponse à une alerte ne bloque rien.*"
    timeout: 5000
    label: "« 1 pour bloquer » is off again"
- back
- extendedWaitUntil:
    visible:
      id: settings-whatsapp
    timeout: 10000
    label: "Back in Réglages"
