# Buttons instead of written paths, and Réglages in words (#124), in the demo.
# Before the demo relay is paired, « Téléphone perdu » says the household
# needs a relay, with « Installer un relais » where « Réglages > Plus de
# fonctionnalités > Relais à la maison » was written: the button opens
# « Relais à la maison », back. Then Réglages: « Détails techniques » is
# closed (no version, no « moteur »), opens, and closes again.
# The Devices tab's « away from home without a relay » page is not reachable
# in the demo (its box always answers): Jest covers it (awayNoRelay.test.tsx).
# Starts on any tab or in Plus de fonctionnalités (household-steps.yaml ends
# there), before relay-pairing-steps.yaml. Ends in Réglages. No clearState.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-settings
    commands:
      - back
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-recovery
    direction: DOWN
- tapOn:
    id: settings-recovery
- extendedWaitUntil:
    visible:
      id: coowner-no-relay
    timeout: 10000
    label: "Téléphone perdu: no relay yet"
- assertNotVisible: ".*Réglages >.*"
- scrollUntilVisible:
    element:
      id: coowner-install-relay
    direction: DOWN
- tapOn:
    id: coowner-install-relay
- extendedWaitUntil:
    visible:
      id: relay-intro
    timeout: 10000
    label: "« Installer un relais » opens Relais à la maison"
- assertVisible: "Un relais pour votre box"
- back
- extendedWaitUntil:
    visible:
      id: recovery-coowners
    timeout: 10000
    label: "Back in Téléphone perdu"
- back
- extendedWaitUntil:
    visible:
      id: settings-recovery
    timeout: 10000
    label: "Back in Réglages"
- scrollUntilVisible:
    element:
      id: settings-technical
    direction: DOWN
- assertVisible: "Détails techniques"
- assertNotVisible:
    id: settings-version
- tapOn:
    id: settings-technical
- scrollUntilVisible:
    element:
      id: settings-version
    direction: DOWN
- assertVisible: "Version .* · moteur .*"
- scrollUntilVisible:
    element:
      id: settings-technical
    direction: UP
- tapOn:
    id: settings-technical
- assertNotVisible:
    id: settings-version
