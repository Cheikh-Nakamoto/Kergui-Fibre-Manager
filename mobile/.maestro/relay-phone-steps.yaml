# This phone as the relay (#45), in the demo: Plus de fonctionnalités (#76,
# from Réglages) shows « Ce téléphone sert de relais » and its switch
# (off); the item opens the flow, where the demo plays the owner: its QR,
# this phone's six digits, the owner's confirmation, then « Démarrer le
# relais » shows the running state. No service is started and nothing is
# sent in the demo; the switch stays off.
# Runs after relay-disclosure-steps.yaml (the disclosure not accepted).
# Starts on any tab (relay-pairing-steps.yaml ends in Plus de
# fonctionnalités), ends in Plus de fonctionnalités.
appId: org.kergui.app
---
- runFlow: more-features-steps.yaml
- scrollUntilVisible:
    element:
      id: settings-relay-phone
    direction: DOWN
- assertVisible: "Ce téléphone sert de relais"
- assertVisible:
    id: settings-relay-phone-switch
- tapOn:
    id: settings-relay-phone
# The disclosure (#53) comes first: relay-disclosure-steps.yaml, just
# before, cancelled it, and the demo keeps no answer. Accepted here.
- extendedWaitUntil:
    visible:
      id: relay-disclosure
    timeout: 10000
    label: "The relay's disclosure"
- scrollUntilVisible:
    element:
      id: relay-disclosure-accept
    direction: DOWN
- tapOn:
    id: relay-disclosure-accept
- extendedWaitUntil:
    visible:
      id: relay-phone-intro
    timeout: 10000
    label: "What a relay phone is"
- scrollUntilVisible:
    element:
      id: relay-phone-demo
    direction: UP
- assertVisible: "Faire de ce téléphone un relais"
- assertVisible:
    id: relay-manual-code
- scrollUntilVisible:
    element:
      id: relay-demo-qr
    direction: DOWN
- tapOn:
    id: relay-demo-qr
- extendedWaitUntil:
    visible:
      id: relay-my-code
    timeout: 20000
    label: "This phone's six digits"
- assertVisible: "Votre code à 6 chiffres"
- assertVisible:
    id: relay-waiting
- assertVisible: "En attente de la confirmation du propriétaire…"
- scrollUntilVisible:
    element:
      id: relay-demo-confirm
    direction: DOWN
- tapOn:
    id: relay-demo-confirm
- extendedWaitUntil:
    visible:
      id: relay-confirmed
    timeout: 10000
    label: "Confirmed by the (simulated) owner"
- assertVisible: "Relais confirmé"
- scrollUntilVisible:
    element:
      id: relay-start-service
    direction: DOWN
- tapOn:
    id: relay-start-service
- extendedWaitUntil:
    visible:
      id: relay-active
    timeout: 10000
    label: "The relay's state"
- assertVisible: "Ce téléphone est le relais de la box"
- assertVisible:
    id: relay-state-active
- scrollUntilVisible:
    element:
      id: relay-stop
    direction: DOWN
- tapOn:
    id: relay-stop
- extendedWaitUntil:
    visible:
      id: relay-confirmed
    timeout: 10000
    label: "Stopped"
- back
- extendedWaitUntil:
    visible:
      id: settings-relay-phone
    timeout: 10000
    label: "Back in Plus de fonctionnalités"
