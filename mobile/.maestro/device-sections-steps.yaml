# The Devices tab's filter under the search bar (owner request, 2026-11-23):
# « Connectés » (default) and « Bloqués » (blocked by the filter, and Wi-Fi
# access cut). On the demo F6600P: block Laptop-Bureau, see it leave
# « Connectés » for « Bloqués », unblock it, see it come back. Starts and
# ends on the demo device list, « Connectés » selected.
appId: org.kergui.app
---
- tapOn: Appareils
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
# At the foot of the device sheet, below the fold since #58: scroll to it.
- scrollUntilVisible:
    element:
      id: device-toggle-block
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-toggle-block
- tapOn: Oui, bloquer
- extendedWaitUntil:
    visible: Débloquer
    timeout: 20000
- back
- extendedWaitUntil:
    notVisible: Laptop-Bureau
    timeout: 20000
    label: "Laptop-Bureau left « Connectés »"
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-blocked
# « Laptop-Bureau is under « Bloqués par le filtre »
- scrollUntilVisible:
    element:
      id: devices-blocked-section
    direction: DOWN
    timeout: 20000
- assertVisible: "Bloqués par le filtre \\(1\\)"
# Give it back.
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
# At the foot of the device sheet, below the fold since #58: scroll to it.
- scrollUntilVisible:
    element:
      id: device-toggle-block
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-toggle-block
- tapOn: Oui, débloquer
- extendedWaitUntil:
    visible: Bloquer
    timeout: 20000
- back
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-connected
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-connected
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- runFlow: devices-top-steps.yaml
