# The Devices tab's filter under the search bar (owner request, 2026-11-23):
# « Appareils » (default) and « Bloqués » (blocked by the filter, and Wi-Fi
# access cut). On the demo F6600P: block Laptop-Bureau, see it leave
# « Appareils » for « Bloqués », unblock it, see it come back. Starts and
# ends on the demo device list, « Appareils » selected.
appId: org.kergui.app
---
- tapOn: Appareils
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
# « Bloqué » among the sheet's three choices (#108): no question, an
# « Annuler » bar instead (#111 R6).
- scrollUntilVisible:
    element:
      id: device-trust-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-trust-blocked
- extendedWaitUntil:
    visible:
      id: device-blocked-badge
    timeout: 20000
- back
- extendedWaitUntil:
    notVisible: Laptop-Bureau
    timeout: 20000
    label: "Laptop-Bureau left « Appareils »"
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-blocked
# Laptop-Bureau is under « Bloqués · pas d’internet »
- scrollUntilVisible:
    element:
      id: devices-blocked-section
    direction: DOWN
    timeout: 20000
# The demo box has another device blocked already: the count is not fixed.
- assertVisible: "Bloqués · pas d.internet \\(\\d+\\)"
- assertVisible: Laptop-Bureau
# Give it back.
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- tapOn: Laptop-Bureau
# Back to « Autorisé » (#108): unblocked and authorised again, as the demo
# started (a block withdraws the authorisation, RFC-007 D1).
- scrollUntilVisible:
    element:
      id: device-trust-authorised
    direction: UP
    timeout: 20000
- tapOn:
    id: device-trust-authorised
- extendedWaitUntil:
    visible:
      id: device-approved-badge
    timeout: 20000
- back
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-connected
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-connected
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
- runFlow: devices-top-steps.yaml
