# The demo flow on a real phone, WITHOUT erasing the app's data (no
# clearState): the household's box password and device names stay. Some
# phones (ColorOS) also refuse `pm clear` from adb. It needs the app on the
# welcome screen or already in demo mode; on a real box session it stops,
# and the user picks "Oublier cette box" themselves. It leaves the app in demo.
appId: org.kergui.app
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: welcome-demo
    commands:
      - runFlow: welcome-relay-steps.yaml
      - runFlow: lost-phone-steps.yaml
      - tapOn:
          id: welcome-demo
# Scrolled to (#108: the Wi-Fi card at the top pushes the list down).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
    label: "Demo device list (if this fails, the app is on a real box session: open Réglages > Oublier cette box first)"
- runFlow: macfilter-setup-steps.yaml
- runFlow: design-steps.yaml
- runFlow: wifi-cut-steps.yaml
- runFlow: closed-wifi-steps.yaml
- runFlow: list-full-steps.yaml
- runFlow: list-full-unknown-steps.yaml
- runFlow: demo-steps.yaml
- runFlow: conso-steps.yaml
- runFlow: history-steps.yaml
- runFlow: wifi-ssid-steps.yaml
- runFlow: confirm-dialog-steps.yaml
- runFlow: unblock-all-steps.yaml
- runFlow: auto-reject-steps.yaml
- runFlow: household-steps.yaml
- runFlow: away-steps.yaml
- runFlow: relay-pairing-steps.yaml
- runFlow: relay-disclosure-steps.yaml
- runFlow: relay-phone-steps.yaml
- runFlow: remote-steps.yaml
- runFlow: house-remote-steps.yaml
- runFlow: delegation-steps.yaml
- runFlow: recovery-discovery-steps.yaml
- runFlow: recovery-steps.yaml
- runFlow: whatsapp-steps.yaml
- runFlow: relay-names-steps.yaml
- runFlow: device-approval-steps.yaml
- runFlow: vocabulary-steps.yaml
- runFlow: device-sections-steps.yaml
- runFlow: this-phone-steps.yaml
- runFlow: self-lockout-steps.yaml
- runFlow: report-steps.yaml
- runFlow: hub-backup-steps.yaml
- runFlow: account-privacy-steps.yaml
- runFlow: locked-steps.yaml
- runFlow: device-names-steps.yaml
- runFlow: password-eye-steps.yaml
- runFlow: wifi-password-steps.yaml
- runFlow: notifications-a11y-steps.yaml
