# This phone (#86) and the owner's phones (#87) in the demo: the demo box
# lists « ce téléphone » (Mon-Telephone, mobilecore DemoPhoneMAC), which the
# core marks Self, and the demo owner's other phone (Telephone-Proprio,
# DemoOwnerPhoneMAC), which it marks Owner. On the Devices tab neither is in
# the list; the discreet line « Ce téléphone et 1 téléphone du propriétaire
# ne sont pas dans la liste » under the list says why. Starts on any tab (or on a screen
# above the tabs), ends at the top of the Devices tab, « Appareils » shown.
# No clearState: runs after the demo is open, alone (local-e2e.sh --flow) or
# within demo.yaml / demo-device.yaml.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-devices
    commands:
      - back
- tapOn:
    id: tab-devices
- runFlow: devices-top-steps.yaml
# From the top of the tab, the list starts below the fold (the household
# cut card sits above it on a small screen): scroll down to it.
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
    label: "The demo device list"
# The filters sit above the list: back to the top, then down to them.
- runFlow: devices-top-steps.yaml
- scrollUntilVisible:
    element:
      id: devices-filter-connected
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-connected
- scrollUntilVisible:
    element:
      id: devices-hidden
    direction: DOWN
    timeout: 20000
- assertVisible: "Ce téléphone et 1 téléphone du propriétaire ne sont pas dans la liste : Kergui ne les bloque jamais."
- assertNotVisible: Mon-Telephone
- assertNotVisible: Telephone-Proprio
- runFlow: devices-top-steps.yaml
