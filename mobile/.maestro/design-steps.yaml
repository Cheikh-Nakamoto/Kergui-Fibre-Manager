# The app in the website's look (#128): one capture of each main screen, for
# the design review before / after. Shared by demo.yaml (CI, emulator) and
# demo-device.yaml (a real phone, data kept): no clearState, no launchApp.
# Starts and ends on the demo device list, and changes nothing on the box.
# The captures follow the phone's mode: run it once in light and once in
# dark (CI: `adb shell cmd uimode night yes|no`; a phone: its own setting).
#
# Each takeScreenshot writes <name>.png in the directory maestro is started
# from:
#   design-1-devices    Appareils: header, filter, round state badges
#   design-2-blocked    « Bloqués »: red for the blocked
#   design-3-device     a device's sheet: « Détails techniques » opened,
#                       MAC / IP in JetBrains Mono (#121: closed by default)
#   design-4-conso      Conso: the month's total in Chakra Petch
#   design-5-wifi       Wi-Fi: the Wi-Fi's card (#134), the network cards
#   design-6-settings   Réglages: section headers, the amber tile
#   design-7-features   Plus de fonctionnalités
#   design-8-journal    Journal: lines in JetBrains Mono
appId: org.kergui.app
---
# Scrolled to: the banners above the list can push it down (the Wi-Fi
# card, there since #108, left for the Wi-Fi tab in #134).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
    label: "Demo device list"
- waitForAnimationToEnd
- takeScreenshot: design-1-devices

- scrollUntilVisible:
    element:
      id: devices-filter-blocked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: devices-filter-blocked
- extendedWaitUntil:
    visible:
      id: devices-blocked-section
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: design-2-blocked
- tapOn:
    id: devices-filter-connected
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000

- tapOn: Laptop-Bureau
- extendedWaitUntil:
    visible:
      id: device-head
    timeout: 20000
    label: "The device's sheet"
# MAC and IP are in « Détails techniques », closed at the bottom (#121).
- scrollUntilVisible:
    element:
      id: device-tech
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-tech
- scrollUntilVisible:
    element:
      id: device-details
    direction: DOWN
    timeout: 20000
    label: "The device's sheet, « Détails techniques » open: MAC and IP"
- waitForAnimationToEnd
- takeScreenshot: design-3-device
- back

- tapOn:
    id: tab-usage
- extendedWaitUntil:
    visible:
      id: usage-total
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: design-4-conso

- tapOn:
    id: tab-wifi
- extendedWaitUntil:
    visible:
      id: wifi-screen
    timeout: 20000
# The top of the tab (#134): the Wi-Fi's card above the networks.
- runFlow: wifi-top-steps.yaml
- scrollUntilVisible:
    element:
      id: lock-card
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: wifi-ssid-DEV.WIFI.AP1
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: design-5-wifi

- tapOn:
    id: tab-settings
# Réglages is long and keeps its scroll position from earlier flows: bring
# the tile into view rather than expecting it on screen.
- scrollUntilVisible:
    element:
      id: settings-more-features
    direction: UP
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: design-6-settings

- tapOn:
    id: settings-more-features
- extendedWaitUntil:
    visible:
      id: settings-relay
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: design-7-features
- back

- scrollUntilVisible:
    element:
      id: settings-journal
    direction: DOWN
    timeout: 20000
- tapOn:
    id: settings-journal
- waitForAnimationToEnd
- takeScreenshot: design-8-journal
- back

- tapOn:
    id: tab-devices
# Scrolled to: the banners above the list can push it down (the Wi-Fi
# card, there since #108, left for the Wi-Fi tab in #134).
- scrollUntilVisible:
    element: Laptop-Bureau
    direction: DOWN
    timeout: 20000
    label: "Back on the device list"
