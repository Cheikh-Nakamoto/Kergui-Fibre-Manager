# A new Wi-Fi password, start to end (#123, audit H8), on the demo F6600P's
# MonWiFi-2G, the network « ce téléphone » is on: the password is shown
# while it is typed; the warning names the action and says every device of
# the house, this phone too, must type it again, with a red button; after
# it, a screen shows the new password big, its Wi-Fi QR code and « Envoyer
# sur WhatsApp » (not tapped: it would leave the app). « Terminé » closes it,
# the Wi-Fi tab says « Mot de passe changé. », and the demo's own password
# goes back. The demo box is a local mock (mobilecore's mockrouter): it
# takes the password and nothing is cut. Starts in the tabs, or on a screen
# above them; ends on the Wi-Fi tab. No clearState.
# The ids hold dots (DEV.WIFI.AP1): as patterns they still match themselves.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-wifi
    commands:
      - back
- tapOn:
    id: tab-wifi
- extendedWaitUntil:
    visible:
      id: wifi-ssid-DEV.WIFI.AP1
    timeout: 20000
    label: "The demo box's Wi-Fi networks"
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-open-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-open-DEV.WIFI.AP1
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-DEV.WIFI.AP1
- inputText: "Maison-Diop-2026"
- hideKeyboard
# Shown while typing, with no eye to find.
- extendedWaitUntil:
    visible: "Maison-Diop-2026"
    timeout: 10000
    label: "The new password is shown while typing"

# The warning: the action, every device of the house and this phone, red.
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-save-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-save-DEV.WIFI.AP1
- extendedWaitUntil:
    visible:
      id: confirm-dialog
    timeout: 10000
    label: "The warning before the change"
- assertVisible:
    id: confirm-title
    text: "Changer le mot de passe du réseau « MonWiFi-2G ».*"
- assertVisible: "Tous les appareils de la maison vont se déconnecter, ce téléphone aussi. Il faudra taper le nouveau mot de passe sur chacun.*"
- assertVisible: "Oui, changer"
- tapOn:
    id: confirm-ok

# After it: the password big, its QR code, « Envoyer sur WhatsApp ».
- extendedWaitUntil:
    visible:
      id: wifi-password-done
    timeout: 20000
    label: "The new password's screen"
- assertVisible: "Mot de passe changé."
- assertVisible:
    id: wifi-password-done-password
    text: "Maison-Diop-2026"
- scrollUntilVisible:
    element:
      id: wifi-password-done-qr
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: wifi-password-done-whatsapp
    direction: DOWN
    timeout: 20000
- assertVisible: "Envoyer sur WhatsApp"
# Back to the Wi-Fi tab: the screen forgets the password.
- scrollUntilVisible:
    element:
      id: wifi-password-done-close
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-password-done-close
- extendedWaitUntil:
    notVisible:
      id: wifi-password-done
    timeout: 10000
    label: "The screen is closed"
- assertNotVisible: "Maison-Diop-2026"
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-done-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- assertVisible: "Mot de passe changé."

# The demo's own password goes back.
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-open-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-open-DEV.WIFI.AP1
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-DEV.WIFI.AP1
- inputText: "mock-passphrase-1"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: wifi-ssid-password-save-DEV.WIFI.AP1
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-ssid-password-save-DEV.WIFI.AP1
- tapOn:
    id: confirm-ok
- extendedWaitUntil:
    visible:
      id: wifi-password-done
    timeout: 20000
    label: "The demo's password is back"
- scrollUntilVisible:
    element:
      id: wifi-password-done-close
    direction: DOWN
    timeout: 20000
- tapOn:
    id: wifi-password-done-close
- extendedWaitUntil:
    notVisible:
      id: wifi-password-done
    timeout: 10000
    label: "Back on the Wi-Fi tab"
