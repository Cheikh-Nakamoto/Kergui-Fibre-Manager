# Household members (#42) in the demo: from Réglages > Plus de
# fonctionnalités (#76), open "Foyer et membres", see the
# example household (owner, admin, viewer) marked as a demo, with how to
# invite the members of one's own (sign in with the WhatsApp number). No
# invite is sent from the demo. Back to Plus de fonctionnalités. Starts
# there (auto-reject-steps.yaml ends there) or on any tab.
appId: org.kergui.app
---
- runFlow: more-features-steps.yaml
- scrollUntilVisible:
    element:
      id: settings-household
    direction: DOWN
- tapOn:
    id: settings-household
- extendedWaitUntil:
    visible:
      id: household-demo
    timeout: 10000
    label: "The demo household"
- assertVisible: ".*Connectez-vous avec votre numéro WhatsApp pour inviter.*"
- assertVisible: "Membres \\(3\\)"
- assertVisible: "Propriétaire"
- assertVisible: "Administrateur"
- assertVisible: "Lecteur"
- assertNotVisible:
    id: household-invite-send
- back
- extendedWaitUntil:
    visible:
      id: settings-household
    timeout: 10000
    label: "Back in Plus de fonctionnalités"
