# Household members (#42) in the demo: from Réglages, open "Foyer", see the
# example household (owner, admin, viewer) marked as a demo, with how to
# invite the members of one's own (sign in with the WhatsApp number). No
# invite is sent from the demo. Back to Réglages. Starts in Réglages
# (auto-reject-steps.yaml ends there) or on any tab.
appId: org.kergui.app
---
- runFlow:
    when:
      notVisible:
        id: tab-settings
    commands:
      - back
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-household
    direction: UP
- tapOn:
    id: settings-household
- extendedWaitUntil:
    visible:
      id: household-demo
    timeout: 10000
    label: "The demo household"
- assertVisible: ".*Connectez-vous avec votre numéro WhatsApp pour inviter.*"
- assertVisible: "Membres \\(3\\)"
- assertVisible: "Propriétaire"
- assertVisible: "Administrateur"
- assertVisible: "Lecteur"
- assertNotVisible:
    id: household-invite-send
- back
- extendedWaitUntil:
    visible:
      id: settings-household
    timeout: 10000
    label: "Back in Réglages"
