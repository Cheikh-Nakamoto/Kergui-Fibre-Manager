# Checks the hub (RFC-005): Go tests against a real Postgres, the architecture
# rule that keeps the kernel out of the CLI and the mobile core, and the
# container image: on a hub-v* tag it is pushed to GHCR as
# ghcr.io/cheikh-nakamoto/kergui-hub:<version> (tag without "hub-v") and
# :latest, with the version embedded (kergui-hub -version). Other runs only
# build it. No secret goes into the image: the VPS gives them at run time.
name: hub-ci

on:
  # Only on a release tag, or by hand: day-to-day checks run locally
  # (make check, make hub-test) before every push.
  push:
    tags: ['hub-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-retries 20
    env:
      KERGUI_HUB_TEST_DATABASE_URL: postgres://hub:hub@localhost:5432/hub?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/kergui-hub ./internal/hub/... ./internal/agent/... ./internal/trust/... ./internal/mockrouter/...
      # internal/agent, internal/trust and the F6600P mock are the relay
      # side of RFC-005: the end-to-end test under internal/hub/e2e drives
      # all three against this Postgres.
      # -p 1: the hub test packages share one database, and the kernel's
      # outbox dispatcher holds a database-wide advisory lock, so only one
      # hub at a time may dispatch (see the Makefile's hub-test).
      - run: go test -count=1 -p 1 ./cmd/kergui-hub ./internal/hub/... ./internal/agent/... ./internal/trust/... ./internal/mockrouter/... ./tests/...

  image:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Version and image name
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/hub-v* ]]; then
            echo "version=${GITHUB_REF_NAME#hub-v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kergui-hub" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          docker build -f deploy/hub/Dockerfile \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} .
      - name: The binary reports the tag's version
        run: |
          got=$(docker run --rm ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} -version)
          test "$got" = "${{ steps.meta.outputs.version }}" || { echo "image reports $got"; exit 1; }
      - name: Push to GHCR
        if: steps.meta.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=${{ steps.meta.outputs.image }}
          v=${{ steps.meta.outputs.version }}
          docker tag "$img:$v" "$img:latest"
          docker push "$img:$v"
          docker push "$img:latest"
