# Checks every change to the app or the Go core: Go checks, JS checks, an
# unsigned Android build with the Maestro demo flow on an emulator, and an iOS
# simulator build. No secrets are used here.
name: mobile-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - mobile/**
      - mobilecore/**
      - internal/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/mobile-*.yml
  push:
    branches: [main]
    paths:
      - mobile/**
      - mobilecore/**
      - internal/**
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      # Android builds use the WebAssembly SQLite driver (see
      # internal/adapter/persistence/sqlite/driver_wasmsqlite.go): test it too.
      - run: go test -tags kergui_wasmsqlite ./...

  js:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci

  core-android:
    uses: ./.github/workflows/mobile-core.yml
    with:
      platform: android

  core-ios:
    uses: ./.github/workflows/mobile-core.yml
    with:
      platform: ios

  android:
    needs: [core-android, js]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: kergui-core-android
          path: mobile/modules/kergui-core/android/libs
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prebuild and build (release, debug-signed)
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kergui-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  e2e-android:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: kergui-android-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # The emulator runner downloads its system image on every run, and that
      # download has come back corrupt ("Error on ZipFile unknown archive"),
      # failing the job before the app starts. Keep the image in the cache,
      # fetch it with retries, and fall back to API 34 if API 35 stays broken.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: emulator-image-google_apis-x86_64-v1
      - name: Fetch the emulator system image
        id: image
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdk" ] || sdk=sdkmanager
          for api in 35 34; do
            dir="$ANDROID_HOME/system-images/android-$api/google_apis/x86_64"
            for try in 1 2 3; do
              if [ -f "$dir/system.img" ]; then echo "api=$api" >> "$GITHUB_OUTPUT"; exit 0; fi
              rm -rf "$dir"
              yes | "$sdk" --install "system-images;android-$api;google_apis;x86_64" > /dev/null || true
              [ -f "$dir/system.img" ] || { echo "::warning::system image API $api, attempt $try failed"; sleep 15; }
            done
          done
          echo "::error::no usable emulator system image"; exit 1
      - name: Demo flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.image.outputs.api }}
          arch: x86_64
          target: google_apis
          # The first launch on a cold emulator sometimes fails before the app
          # even starts: retry the flow once. On a real failure, keep the app's
          # crash lines in the log and the Maestro output as an artifact.
          script: |
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != 1 ] || ! pm path android >/dev/null 2>&1; do sleep 2; done'
            adb install -r app-release.apk
            adb logcat -c
            maestro test --debug-output maestro-debug mobile/.maestro/demo.yaml || { echo "::warning::Maestro flow failed, retrying once"; sleep 10; maestro test --debug-output maestro-debug mobile/.maestro/demo.yaml; } || { adb logcat -d -v brief | grep -E 'AndroidRuntime|FATAL|KerguiCore|ReactNativeJS|libc |DEBUG' | tail -n 200; exit 1; }
            maestro test mobile/.maestro/screenshots.yaml || echo "::warning::light screenshots failed"
            mkdir -p screenshots/light && find . -name 'shot-*.png' -not -path './screenshots/*' -exec mv {} screenshots/light/ \;
            adb shell cmd uimode night yes
            maestro test mobile/.maestro/screenshots.yaml || echo "::warning::dark screenshots failed"
            mkdir -p screenshots/dark && find . -name 'shot-*.png' -not -path './screenshots/*' -exec mv {} screenshots/dark/ \;
      # Main screens in light and dark mode, for design review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-debug
          path: maestro-debug/
          include-hidden-files: true   # Maestro writes under .maestro/
          retention-days: 7

  ios:
    needs: [core-ios, js]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: kergui-core-ios
          path: mobile/modules/kergui-core/ios/KerguiCore.xcframework
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Prebuild and build for the simulator (unsigned)
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Kergui.xcworkspace -scheme Kergui -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 50
