# kergui-hub + Postgres (RFC-005), for running a hub on your own machine.
# Production is NOT this file: Dokploy builds deploy/hub/Dockerfile and runs
# its own Postgres service (docs/hub-production.md).
# Copy hub.env.example to hub.env, fill the secrets, then:
#   docker compose -f deploy/hub/compose.yaml --env-file deploy/hub/hub.env up -d --build
#
# The hub listens on 127.0.0.1:8090 only.
#
# WhatsApp (KERGUI_HUB_NOTIFIER=whatsmeow) runs inside the hub: no extra
# service. Its session is stored in the hub's Postgres, so run one hub only.
# Link the number once from the admin route: docs/hub-whatsapp.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${KERGUI_HUB_DB_PASSWORD:?set KERGUI_HUB_DB_PASSWORD in hub.env}
    volumes:
      - hub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      retries: 20

  hub:
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
      args:
        VERSION: ${KERGUI_HUB_VERSION:-dev}
    image: kergui-hub:${KERGUI_HUB_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${KERGUI_HUB_ENV_FILE:-hub.env}
    environment:
      KERGUI_HUB_DATABASE_URL: postgres://hub:${KERGUI_HUB_DB_PASSWORD}@postgres:5432/hub?sslmode=disable
      TZ: Africa/Dakar
    ports:
      - "127.0.0.1:${KERGUI_HUB_PORT:-8090}:8090"
    read_only: true
    cap_drop: [ALL]
    # Migrations run at start (app.New); /ready answers 200 once the database
    # is reachable. The image's HEALTHCHECK runs `/kergui-hub -healthcheck`.

volumes:
  hub-db:
